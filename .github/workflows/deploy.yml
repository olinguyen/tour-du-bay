# Builds the site and publishes it to GitHub Pages.
#
# Pages must be set to build from a workflow for this to run: repository
# Settings → Pages → Source → "GitHub Actions". Serving the branch directly
# publishes this repo's source, where index.html still points at the dev entry
# (/src/main.tsx) that only Vite can resolve — the page loads blank.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs npm ci and third-party actions)
# only needs to read the repo. The deploy job grants itself the Pages scopes.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:routes
      # `build` runs tsc first, so this covers the typecheck too.
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
